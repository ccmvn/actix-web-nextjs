[package]
name = "actix-web-nextjs"
description = "Actix Web service for hosting statically exported Next.js apps"
version = "0.2.8"
edition = "2021"
authors = ["ccmvn <info@ccmvn.co>"]

license = "MIT OR Apache-2.0"
repository = "https://github.com/ccmvn/actix-web-nextjs"
homepage = "https://github.com/ccmvn/actix-web-nextjs"

exclude = [
    "fixtures/*",
]

[dependencies]
actix-files = { version = "0.6.8", default-features = false }
actix-service = { version = "2.0.3", default-features = false }
actix-web = { version = "4.11.0", default-features = false, features = ["macros"] }
glob = "0.3.3"
path-tree = "0.8.3"
regex = { version = "1.12.2", default-features = false, features = ["unicode-perl"] }
once_cell = "1.21.3"
tracing = { version = "0.1.41", default-features = false, features = ["log"] }
anyhow = "1.0.100"
thiserror = "2.0.17"

[features]
default = ["wildcards"]
wildcards = []
